name: Prevent Supabase Pause

on:
  schedule:
    # Runs at 8:00 AM UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual testing

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Send Heartbeat to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
            
            async function ping() {
              console.log('Initiating Heartbeat...');
              
              // 1. Fetch first record
              const { data: records, error: selectError } = await supabase.from('projects').select('id').limit(1);
              
              if (selectError) {
                console.error('FATAL: Select failed:', selectError.message);
                process.exit(1);
              }
              
              if (!records || records.length === 0) {
                console.error('FATAL: Table is empty!');
                process.exit(1); 
              }

              // 2. Perform Update and chain .select() to verify affected rows
              const { data: updatedRows, error: updateError } = await supabase
                .from('projects')
                .update({ last_ping_at: new Date().toISOString() })
                .eq('id', records[0].id)
                .select();
              
              if (updateError) {
                console.error('FATAL: Update error:', updateError.message);
                process.exit(1);
              }

              if (!updatedRows || updatedRows.length === 0) {
                console.error('FATAL: 0 rows were updated! Row Level Security (RLS) is blocking the update. Please use the service_role key in SUPABASE_KEY secret.');
                process.exit(1);
              }
              
              console.log('Success! Updated record ID:', updatedRows[0].id, 'at', updatedRows[0].last_ping_at);
            }
            
            ping();
          "
