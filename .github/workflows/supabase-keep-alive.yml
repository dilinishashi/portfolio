name: Prevent Supabase Pause

on:
  schedule:
    # Runs at 8:00 AM UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual testing

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Send Heartbeat to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
            
            async function ping() {
              console.log('Initiating Heartbeat...');
              
              // 1. Fetch records safely and catch any connection/permission errors
              const { data: records, error: selectError } = await supabase.from('projects').select('id').limit(1);
              
              if (selectError) {
                console.error('FATAL: Failed to connect or fetch from table:', selectError.message);
                process.exit(1);
              }
              
              if (!records || records.length === 0) {
                console.error('FATAL: The table is completely empty! Add at least one row so the script has something to update.');
                process.exit(1); 
              }

              // 2. Perform the Update
              const { error: updateError } = await supabase
                .from('projects')
                .update({ last_ping_at: new Date().toISOString() })
                .eq('id', records[0].id);
              
              if (updateError) {
                console.error('FATAL: Heartbeat update failed:', updateError.message);
                process.exit(1);
              }
              
              console.log('Success! Database engine acknowledged write activity.');
            }
            
            ping();
          "
